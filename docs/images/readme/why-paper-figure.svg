</g>
<path d="M867 347l5 5 9-11" fill="none" stroke="#43826B" stroke-width="2.5"/>
<text x="890" y="352" font-size="11.5" fill="#60717D">Relationships · type · paper-scale legibility</text>
<text x="848" y="404" font-size="13" fill="#60717D">Render the PPTX. Inspect the result.</text>

<path d="M36 431H1164" stroke="#DBE2E7"/>
<text x="36" y="462" font-size="12" fill="#60717D">IMAGE-MODEL DRAFT</text>
<text x="354" y="462" font-size="12" fill="#60717D">NATIVE POWERPOINT OBJECTS</text>
