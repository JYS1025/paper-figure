<path d="M671 217H687M671 269H687M671 321H687" stroke="#A2AAB2" stroke-width="1.2"/>
<text x="696" y="221" font-size="11.5" fill="#655083">Text + math</text>
<text x="696" y="273" font-size="11.5" fill="#436A7A">Connections</text>
<text x="696" y="325" font-size="11.5" fill="#58766D">Shapes</text>
<text x="388" y="373" font-size="12" fill="#60717D">Pictures remain separate and replaceable.</text>
<text x="388" y="404" font-size="13" fill="#60717D">Select an object. Revise its meaning.</text>

<path d="M794 274H826" stroke="#475864" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Stage three: actual file inspection and an explicit editable selection. -->
<text x="848" y="148" font-size="12" font-weight="700" fill="#436A7A">03</text>
<text x="875" y="148" font-size="16" font-weight="700">Check the saved figure</text>
