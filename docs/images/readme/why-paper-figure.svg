<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-labelledby="title desc">
<title id="title">A visual idea, with an editable future</title>
<desc id="desc">An image-model composition is reconstructed into separately editable text, connectors, geometry and replaceable pictures. The saved PowerPoint is then rendered and inspected at paper scale.</desc>
<defs>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#DCE2E7"/></pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#475864"/></marker>
  <marker id="small" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="#667B81"/></marker>
</defs>
<rect width="1200" height="492" rx="18" fill="#F6F8FA"/>
<rect x="1" y="1" width="1198" height="490" rx="18" fill="url(#dots)" stroke="#E2E7EC"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#25333C">
<text x="36" y="37" font-size="11" font-weight="700" letter-spacing="2.1" fill="#58766D">DESIGNED FOR THE NEXT REVISION</text>
<text x="36" y="72" font-size="27" font-weight="700">A visual idea. An editable future.</text>
<text x="36" y="99" font-size="14" fill="#60717D">Composition comes first. The final explanation stays in your hands.</text>

<!-- Stage one: a single visual composition surface. -->
<text x="36" y="148" font-size="12" font-weight="700" fill="#58766D">01</text>
<text x="63" y="148" font-size="16" font-weight="700">Find the visual direction</text>
