<rect x="36" y="170" width="282" height="27" rx="9" fill="#E3EFEB"/>
<rect x="36" y="188" width="282" height="9" fill="#E3EFEB"/>
<circle cx="51" cy="184" r="3" fill="#7FA798"/><circle cx="62" cy="184" r="3" fill="#A5BDB4"/><circle cx="73" cy="184" r="3" fill="#C0D1CA"/>
<text x="301" y="188" text-anchor="end" font-size="10" letter-spacing="1" fill="#55766B">VISUAL DRAFT</text>
<g transform="translate(53 216)">
 <rect x="0" y="18" width="57" height="57" fill="#E3EFEB"/>
 <path d="M0 59 16 35 27 46 43 23 57 44V75H0Z" fill="#81AC99"/><circle cx="44" cy="30" r="7" fill="#DCC49F"/>
 <path d="M64 47H82" stroke="#667B81" stroke-width="2.7" marker-end="url(#small)"/>
 <rect x="91" y="2" width="52" height="91" rx="3" fill="#E6E3F2" stroke="#8A7DAE"/>
 <path d="M103 22H131M103 32H131M103 42H131M103 52H131M103 62H131M103 72H131" stroke="#B5ABC9" stroke-width="4"/>
 <path d="M151 47H169" stroke="#667B81" stroke-width="2.7" marker-end="url(#small)"/>
 <g fill="#D8E7EE" stroke="#7594A7"><rect x="178" y="19" width="20" height="20"/><rect x="202" y="19" width="20" height="20"/><rect x="178" y="43" width="20" height="20"/><rect x="202" y="43" width="20" height="20"/></g>
 <path d="M1 118H145M1 129H193" stroke="#E1E6E9" stroke-width="5"/>
</g>
<text x="36" y="404" font-size="13" fill="#60717D">Explore hierarchy, shape and color.</text>

<path d="M334 274H366" stroke="#475864" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Stage two: an exploded explanation with editable layers. -->
<text x="388" y="148" font-size="12" font-weight="700" fill="#71608C">02</text>
<text x="415" y="148" font-size="16" font-weight="700">Rebuild the explanation</text>
<g stroke="#B2BBC3" stroke-width="1" stroke-dasharray="3 4"><path d="M409 196V361M635 196V361"/></g>
<path d="M393 298H637L671 345H427Z" fill="#FFFFFF" stroke="#C1CBD2" stroke-width="1.2"/>
<path d="M393 246H637L671 293H427Z" fill="#EFF3F7" stroke="#BBC8D4" stroke-width="1.2"/>
<path d="M393 194H637L671 241H427Z" fill="#FFFFFF" stroke="#9C8AB9" stroke-width="1.3"/>
<text x="428" y="224" font-size="17" font-weight="700" fill="#655083">Encoder</text>
<text x="554" y="224" font-size="21" font-family="Georgia,serif" font-style="italic">z<tspan baseline-shift="sub" font-size="13">i</tspan></text>
