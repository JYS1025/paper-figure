name: Repository badges

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  watch:
    types: [started]
  fork:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-badges.yml'
      - 'scripts/update-repo-badges.py'

permissions:
  contents: write

concurrency:
  group: repository-badges
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'JYS1025/paper-figure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Read repository counters
        env:
          GH_TOKEN: ${{ secrets.REPO_STATS_TOKEN || github.token }}
        run: python3 scripts/update-repo-badges.py
      - name: Save changed counters
        run: |
          git add docs/images/readme/badge-stars.svg docs/images/readme/badge-forks.svg docs/images/readme/badge-watchers.svg docs/images/readme/badge-views.svg docs/images/readme/github-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh repository counters'
          git push origin HEAD:main
